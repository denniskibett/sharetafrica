# Runs the whole test suite on every push and pull request. Its job name ("tests") is the status check
# to require in GitHub's branch protection for main, staging and v2.
name: tests

on:
  push:
    branches: [main, staging, v2, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, bcmath, intl, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP packages
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build assets (the pages under test need the Vite manifest)
        run: npm ci && npm run build

      - name: Prepare the app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
